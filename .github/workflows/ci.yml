name: Build and Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: editors
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: periakteon/LibreKO
          ref: e5f0e4200fd42f69934f55557f92f2ee2ccfafde
          path: LibreKO
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Portable tool-path checks
        shell: pwsh
        run: ./editors/scripts/test-tool-paths.ps1
      - name: Build editor and helper
        shell: pwsh
        run: ./editors/scripts/build.ps1
      - name: Core regression suite
        shell: pwsh
        run: dotnet test ./editors/tests/LibreKO.Editors.Core.Tests --nologo
